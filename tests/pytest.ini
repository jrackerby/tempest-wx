[pytest]
# ROOTDIR IS THIS DIRECTORY ON PURPOSE, AND THE SUITE IS RUN FROM HERE.
# The directory above carries the integration's `__init__.py`, which imports
# `homeassistant`. Any collection tree that includes it makes a pytest Package
# node out of `tempest_wx`, whose setup() imports that __init__.py — and the
# whole suite then errors with ModuleNotFoundError: homeassistant, before a
# line of it runs, on a suite whose entire point is that it needs no HA.
#
# `--import-mode=importlib` stops pytest walking up into the package, and
# test_forecast.py loads forecast.py by file path for the same reason. Between
# them, "the transform layer runs with no Home Assistant" is enforced by the
# harness rather than asserted in a comment.
#
# Run it as: cd tests && pytest      (tools/run_tests.sh does this)
addopts = --import-mode=importlib
