name: validate

# The gates live in jrackerby/gha-workflows validate-integration.yml
# (workflow_call); this file keeps the triggers and passes what differs per
# repo. Required contexts on master are "validate / <job>" (jrackerby/HA#821).

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "0 7 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    uses: jrackerby/gha-workflows/.github/workflows/validate-integration.yml@master
    with:
      domain: "tempest_wx"
      public: true
