# Self-assessment against the Home Assistant integration quality scale.
#
# The scale is this component's build standard. This file is the only gate
# there is, because hassfest's `validate_iqs_file` opens
# with `if not integration.core: return`, so a custom component is never checked
# against the scale, and a `quality_scale` key in the manifest is a self-claim
# with nothing behind it. No such key is declared in manifest.json. The rule
# names below are read from `ALL_RULES` in core's script/hassfest/quality_scale.py,
# not from the docs page, which names tiers and not rules.
#
# Honest `todo`s. A rule marked `done` here has actually been done.

rules:
  # --- Bronze ---
  action-setup: done  # no service actions registered
  appropriate-polling: done
  # ^ Cadence comes from the payload's own refresh_interval_seconds, floored
  #   at MIN_SCAN_INTERVAL; the request-refresh debouncer cools down for that
  #   same floor, and a failed poll is re-paced by pacing.py — never below
  #   the floor, and later than the cadence when the vendor said stop.
  brands: todo  # no icon/logo submitted to home-assistant/brands; private integration
  common-modules: done  # coordinator.py, entity.py
  config-flow: done
  config-flow-test-coverage: todo
  # ^ Neither flow is EXERCISED; both need pytest-homeassistant-custom-component.
  #   The options flow's one structural trap is asserted statically instead —
  #   async_create_entry(data=) replaces entry.options wholesale, so every step
  #   must merge over them — because that defect is invisible until a second step
  #   exists and a comment saying so is not a gate. See tests/test_wiring.py.
  dependency-transparency: done  # no third-party requirements at all
  docs-actions: done  # none to document
  docs-conditions: done  # no conditions provided
  docs-triggers: done  # no triggers provided
  docs-high-level-description: done  # README.md
  docs-installation-instructions: done  # README.md
  docs-removal-instructions: done  # README.md
  entity-event-setup: done
  # ^ The local entities subscribe to the UDP listener's dispatcher signal in
  #   async_added_to_hass and unsubscribe through async_on_remove. The socket
  #   itself is opened in async_setup_entry and closed through
  #   entry.async_on_unload, so it goes even if a platform unload fails.
  entity-unique-id: done  # every entity sets one, prefixed by domain and station
  has-entity-name: done  # _attr_has_entity_name = True on the base entity
  runtime-data: done  # entry.runtime_data, typed via TempestConfigEntry
  test-before-configure: done
  # ^ The config flow calls better_forecast against the chosen station before
  #   creating the entry — the same endpoint and token the coordinator polls.
  #   A check on a different channel than the one that will be used certifies
  #   nothing, and certifies it green.
  test-before-setup: done  # async_config_entry_first_refresh
  unique-config-entry: done  # unique_id is tempest_wx_<station_id>

  # --- Silver ---
  action-exceptions: done  # no actions
  config-entry-unloading: done
  # ^ async_unload_entry unloads exactly the platforms that were forwarded.
  #   The integration this replaces unloads [SENSOR, WEATHER] even in local
  #   mode, where only SENSOR was ever set up.
  docs-configuration-parameters: done  # README.md
  docs-installation-parameters: done  # README.md
  entity-unavailable: done
  # ^ Two sources, two answers. The coordinator raises UpdateFailed on an
  #   unreachable API, and this does NOT contradict the never-raise contract a
  #   monitoring coordinator keeps: that governs a coordinator reading other
  #   ENTITIES, which has no service to lose. See coordinator.py's docstring.
  #   The local entities are unavailable when the message type that carries
  #   their reading has not arrived inside its own staleness window — per
  #   SOURCE, because the radio sends wind every 3s and an observation every
  #   60s, and one window over both would call a healthy station dead. A
  #   heartbeat re-judges that verdict on a timer so a station that stops
  #   broadcasting goes unavailable rather than leaving its last reading up.
  integration-owner: done  # @jrackerby
  log-when-unavailable: done  # DataUpdateCoordinator logs once on the crossing and once on recovery
  parallel-updates: done  # PARALLEL_UPDATES = 0 on all three platforms
  reauthentication-flow: done  # async_step_reauth / reauth_confirm, on a rejected token only
  test-coverage: todo
  # ^ 127 tests over the pure layers — the cloud transform, the UDP wire
  #   format, the derived quantities — plus static joins over the platform
  #   declarations and over what setup does with the local_udp option. No HA, no
  #   network, no token. The HA-facing entity classes and the socket lifecycle
  #   are untested; that needs pytest-homeassistant-custom-component, which is
  #   not installed here.

  # --- Gold / Platinum: not targeted. Silver is the target for anything
  #     reading a device or service; these are recorded as todo rather
  #     than exempt so the gap stays visible.
  devices: done  # one service device per station
  diagnostics: todo
  discovery: todo
  # ^ The component now LISTENS to the broadcast but does not offer a
  #   discovery flow off it: an entry still needs a cloud token and a station
  #   choice, so a discovered hub could not be set up without both. Real, and
  #   deliberately not claimed.
  discovery-update-info: todo
  docs-data-update: todo
  docs-examples: todo
  docs-known-limitations: done  # README.md records the token requirement and the local/cloud split
  docs-supported-devices: done  # README.md
  docs-supported-functions: done  # README.md
  docs-troubleshooting: todo
  docs-use-cases: done  # README.md
  dynamic-devices: todo  # one station per entry, by design
  entity-category: done
  # ^ DIAGNOSTIC on the station's own health readings (battery, both signal
  #   strengths, both boot times, both firmware revisions, the sensor-fault
  #   binary sensor). Everything else is weather, which is the primary
  #   reading, not a diagnostic about the thing producing it.
  entity-device-class: done  # every sensor that has a meaningful one declares it
  entity-disabled-by-default: todo
  entity-translations: done  # strings.json + translations/en.json
  exception-translations: todo
  icon-translations: todo
  reconfiguration-flow: todo
  # ^ NOT satisfied by the options flow, which changes how this entry runs and
  #   never what it points at. This rule wants async_step_reconfigure, so a user
  #   can repoint an entry at another station without deleting it and losing its
  #   entity ids. Recorded here so the options flow is not mistaken for it.
  repair-issues: todo
  stale-devices: todo  # one station per entry; nothing goes stale
  inject-websession: done  # async_get_clientsession, passed into TempestApi
  strict-typing: todo  # annotated throughout, but not py.typed and not mypy-clean
  async-dependency: done  # no third-party dependency at all; the only I/O is aiohttp
